---
- hosts: stageall
  gather_facts: no
  become: true
  vars:
    disks:
      /dev/nvme1n1: /data
  tasks:
    - name: 创建挂载目录
      file:
        path: "{{ item.value }}"
        state: directory
        mode: "0755"
      with_dict: "{{ disks }}"

    - name: 卸载磁盘并清理 fstab 旧条目
      mount:
        path: "{{ item.value }}"
        state: absent
      with_dict: "{{ disks }}"

    - name: 格式化磁盘为 ext4
      filesystem:
        fstype: ext4
        dev: "{{ item.key }}"
        force: true
      with_dict: "{{ disks }}"

    - name: 获取磁盘 UUID
      command: blkid -s UUID -o value {{ item.key }}
      register: disk_uuids
      changed_when: false
      with_dict: "{{ disks }}"

    - name: 使用 UUID 挂载磁盘并写入 fstab
      mount:
        path: "{{ item.item.value }}"
        src: "UUID={{ item.stdout }}"
        fstype: ext4
        opts: defaults
        state: mounted
      loop: "{{ disk_uuids.results }}"
