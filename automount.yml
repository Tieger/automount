---
- hosts: stageall
  gather_facts: no
  become: true
  vars:
    disks:
      /dev/vdb: /data
    # 设为 true 将强制格式化（危险：会清除数据）
    force_format: false
  tasks:
    - name: 检测磁盘是否已有文件系统
      command: blkid -o value -s TYPE {{ item.key }}
      register: fs_check
      changed_when: false
      failed_when: false
      with_dict: "{{ disks }}"

    - name: 已有文件系统的磁盘（将跳过格式化）
      debug:
        msg: "{{ item.item.key }} 已有文件系统: {{ item.stdout }}，跳过格式化"
      when: item.stdout | length > 0 and not force_format
      loop: "{{ fs_check.results }}"

    - name: 创建挂载目录
      file:
        path: "{{ item.value }}"
        state: directory
        mode: "0755"
      with_dict: "{{ disks }}"

    - name: 卸载磁盘并清理 fstab 旧条目（仅新盘或强制模式）
      mount:
        path: "{{ item.item.value }}"
        state: absent
      when: item.stdout | length == 0 or force_format
      loop: "{{ fs_check.results }}"

    - name: 格式化磁盘为 ext4（仅新盘或强制模式）
      filesystem:
        fstype: ext4
        dev: "{{ item.item.key }}"
        force: "{{ force_format }}"
      when: item.stdout | length == 0 or force_format
      loop: "{{ fs_check.results }}"

    - name: 获取磁盘 UUID
      command: blkid -s UUID -o value {{ item.key }}
      register: disk_uuids
      changed_when: false
      with_dict: "{{ disks }}"

    - name: 使用 UUID 挂载磁盘并写入 fstab
      mount:
        path: "{{ item.item.value }}"
        src: "UUID={{ item.stdout }}"
        fstype: ext4
        opts: defaults
        state: mounted
      loop: "{{ disk_uuids.results }}"
