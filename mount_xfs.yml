---
# 播放书：挂载XFS磁盘并设置自动启动时挂载（使用UUID）
- name: 挂载XFS磁盘和设置自动启动时挂载
  hosts: stageall
  become: true
  vars:
    mount_point: /data
    device_name: /dev/vdb
    partition_name: /dev/vdb1

  tasks:
    - name: 更新 apt 缓存
      apt:
        update_cache: yes

    - name: 安装 xfsprogs 包
      apt:
        name: xfsprogs
        state: present

    - name: 创建 GPT 分区
      parted:
        device: "{{ device_name }}"
        number: 1
        label: gpt
        state: present

    - name: 使用 XFS 格式化分区
      filesystem:
        fstype: xfs
        dev: "{{ partition_name }}"

    - name: 创建挂载点目录
      file:
        path: "{{ mount_point }}"
        state: directory
        mode: "0755"

    - name: 获取分区 UUID
      command: blkid -s UUID -o value {{ partition_name }}
      register: partition_uuid
      changed_when: false

    - name: 使用 UUID 挂载 XFS 分区并写入 fstab
      mount:
        path: "{{ mount_point }}"
        src: "UUID={{ partition_uuid.stdout }}"
        fstype: xfs
        opts: defaults,nofail,discard
        state: mounted
